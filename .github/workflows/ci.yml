name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Report files match their PBIR JSON schemas
        run: python scripts/validate_report.py
      - name: Report definition is up to date with scripts/build_report.py
        run: |
          python scripts/build_report.py
          git diff --exit-code -- MarketingPerformance.Report
